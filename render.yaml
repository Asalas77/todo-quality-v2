# Blueprint de Render para desplegar Kontrol gratis, solo para pruebas.
# En render.com: New -> Blueprint -> selecciona este repo -> Render lee este archivo
# y crea los servicios automáticamente (api, web y landing).
#
# Notas sobre el free tier de Render:
# - Web Service (api): "duerme" tras ~15 min sin tráfico; la siguiente petición tarda
#   unos segundos en despertarlo. Normal y gratis siempre.
# - Static Site (web): nunca duerme, siempre gratis, con HTTPS y dominio *.onrender.com.
# - Base de datos: Render solo permite una PostgreSQL gratis por cuenta, y esta cuenta ya
#   tiene otro proyecto usándola. Por eso la base va en Neon (neon.tech) — Postgres
#   gratuito externo, sin límite de tiempo, sin chocar con el cupo de Render.

services:
  - type: web
    name: kontrol-api
    runtime: docker
    plan: free
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: 'true'
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL_SECONDS
        value: 900
      - key: REFRESH_TOKEN_TTL_DAYS
        value: 30
      - key: NODE_ENV
        value: production
      - key: COOKIE_CROSS_SITE
        value: 'true'
      - key: UPLOADS_DIR
        value: /app/uploads
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: kontrol-web
    runtime: static
    buildCommand: cd web && npm ci && npm run build
    staticPublishPath: web/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: kontrol-landing
    runtime: static
    staticPublishPath: landing
